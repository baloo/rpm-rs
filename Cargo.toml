[package]
name = "rpm"
version = "0.18.4"
authors = [
  "René Richter <richterrettich@gmail.com>",
  "Bernhard Schuster <bernhard@ahoi.io>",
  "Max Dymond <cmeister2@gmail.com>",
  "Daniel Alley <dalley@redhat.com>",
]
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "A pure rust library for building and parsing RPMs"
homepage = "https://github.com/rpm-rs/rpm"
repository = "https://github.com/rpm-rs/rpm"
readme = "README.md"
keywords = ["RPM", "packaging"]
categories = ["parsing", "development-tools"]
rust-version = "1.85.0"

[lib]
name = "rpm"

# tests that try to install / verify RPMs using rpm / dnf in Linux containers via podman
[[test]]
name = "rpm-compat-tests"
required-features = ["test-with-podman"]
path = "tests/compat.rs"

[[test]]
name = "signatures"
required-features = ["signature-meta"]
path = "tests/signatures.rs"

[dependencies]
base64 = "0.22"
bitflags = "2"
thiserror = "2"
nom = "8"
num-traits = "0.2"
num-derive = "0.4"
num = "0.4"
enum-primitive-derive = "0.3"
enum-display-derive = "0.1"
digest = "0.11.0-rc.3"
md-5 = "0.11.0-rc.3"
sha1 = "0.11.0-rc.3"
sha2 = "0.11.0-rc.3"
sha3 = "0.11.0-rc.3"
pgp = { version = "0.17", optional = true }
chrono = { version = "0.4", optional = true }
log = "0.4"
itertools = "0.14"
hex = { version = "0.4", features = ["std"] }
zstd = { version = "0.13", optional = true }
liblzma = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true, default-features = false, features = ["zlib-rs"] }
bzip2 = { version = "0.6", optional = true }
zeroize = "1"

[dev-dependencies]
env_logger = "0.11"
serial_test = "3.2"
pretty_assertions = "1.4"
gethostname = "1.0"
hex-literal = "1.0"
tempfile = "3.21.0"

[features]
default = [
    "signature-pgp",
    "gzip-compression",
    "zstd-compression",
    "xz-compression",
]

gzip-compression = ["flate2"]
zstd-compression = ["zstd"]
xz-compression = ["liblzma"]
bzip2-compression = ["bzip2"]

signature-pgp = ["signature-meta", "pgp", "chrono"]
signature-meta = []

# Segregate tests that require podman to be installed
test-with-podman = ["signature-pgp"]

zstdmt = ["zstd-compression", "zstd/zstdmt"]

[patch.crates-io]
pgp = { git = "https://github.com/baloo/rpgp.git", branch = "baloo/bump/2025-11-13" }

camellia = { git = "https://github.com/RustCrypto/block-ciphers.git" }
cast5    = { git = "https://github.com/RustCrypto/block-ciphers.git" }
idea     = { git = "https://github.com/RustCrypto/block-ciphers.git" }
twofish  = { git = "https://github.com/RustCrypto/block-ciphers.git" }

elliptic-curve = { git = "https://github.com/RustCrypto/traits.git" }

ecdsa = { git = "https://github.com/RustCrypto/signatures.git" }

ed448-goldilocks = { git = "https://github.com/RustCrypto/elliptic-curves.git" }
p521             = { git = "https://github.com/RustCrypto/elliptic-curves.git" }
primefield       = { git = "https://github.com/RustCrypto/elliptic-curves.git" }
x448             = { git = "https://github.com/RustCrypto/elliptic-curves.git" }

sha1-checked = { git = "https://github.com/RustCrypto/hashes.git" }

ff = { git = "https://github.com/tarcieri/ff", branch = "rand_core/v0.10.0-rc-2" }
group = { git = "https://github.com/tarcieri/group", branch = "rand_core/v0.10.0-rc-2" }

ed25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek.git", branch = "rand_core/v0.10-rc" }
x25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek.git", branch = "rand_core/v0.10-rc" }

rand_core = { git = "https://github.com/rust-random/rand_core.git" }
